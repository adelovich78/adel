    <main class="main-wrapper" id="main">
{{HEADER:price}}
      <section class="section_plans is-page">
        <div class="padding-global">
          <div class="container-large">
            <div class="padding-section-medium">
              <div class="plan_grid">{{PLANS}}
              </div>
              <ul class="plan_notes" role="list">
                <li><svg class="icon" aria-hidden="true"><use href="#i-shield"/></svg><span data-deposit>{{t:price.deposit}}</span></li>
                <li><svg class="icon" aria-hidden="true"><use href="#i-refresh"/></svg><span data-tpl="price.renewal" data-amount="renewalYearly">{{PRICE_RENEWAL}}</span></li>
              </ul>
            </div>
          </div>
        </div>
      </section>

      <section class="section_options">
        <div class="padding-global">
          <div class="container-large">
            <div class="padding-section-large">
              <div class="options_component">
                <div>
                  <h2 class="heading-style-h3" data-reveal>{{t:price.optT}}</h2>
                  <ul class="options_list" role="list" data-reveal style="--d:1">{{OPTIONS}}
                  </ul>
                </div>
                <a href="/teklif" class="calc_card" data-reveal style="--d:2">
                  <svg class="icon calc_icon" aria-hidden="true"><use href="#i-calc"/></svg>
                  <span class="heading-style-h4">{{t:price.calc}}</span>
                  <span class="text-color-secondary">{{t:price.calcP}}</span>
                  <span class="calc_arrow"><svg class="icon" aria-hidden="true"><use href="#i-arrow"/></svg></span>
                </a>
              </div>
            </div>
          </div>
        </div>
      </section>

      <section class="section_faq">
        <div class="padding-global">
          <div class="container-large">
            <div class="padding-section-large">
              <div class="faq_component">
                <h2 class="heading-style-h2" data-reveal>{{t:price.faqT}}</h2>
                <div class="faq_list" data-reveal style="--d:1">{{FAQ}}
                </div>
              </div>
            </div>
          </div>
        </div>
      </section>
    </main>
