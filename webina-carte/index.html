<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Webina — Carte de visite</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  /* Tokens */
  :root{
    --color--ink:#0d0f1a;
    --color--paper:#f6f5f1;
    --color--accent:#5b5bf7;
    --color--muted:#8a8fa3;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:Inter,sans-serif;background:#e4e3df;}
  .page-wrapper{display:flex;flex-direction:column;gap:2.5rem;align-items:center;padding:3rem 1rem}

  /* Carte 85×55 mm (ratio) */
  .card_component{width:85mm;height:55mm;border-radius:2mm;overflow:hidden;position:relative;box-shadow:0 10px 30px rgba(0,0,0,.15)}

  /* Recto */
  .card_recto{background:var(--color--ink);color:var(--color--paper);display:flex;flex-direction:column;justify-content:space-between;padding:7mm}
  .card_logo{font-weight:800;font-size:9mm;letter-spacing:-.04em;line-height:1}
  .card_logo-dot{color:var(--color--accent)}
  .card_tagline{font-size:2.6mm;color:var(--color--muted);font-weight:500;letter-spacing:.02em}
  .card_shape{position:absolute;right:-12mm;top:-12mm;width:40mm;height:40mm;border-radius:50%;border:1.2mm solid var(--color--accent);opacity:.9}

  /* Verso */
  .card_verso{background:var(--color--paper);color:var(--color--ink);display:flex;flex-direction:column;justify-content:space-between;padding:7mm}
  .card_name{font-weight:700;font-size:4.4mm;letter-spacing:-.01em}
  .card_role{font-size:2.6mm;color:var(--color--accent);font-weight:500;margin-top:.8mm}
  .card_contact-list{display:flex;flex-direction:column;gap:1.2mm;font-size:2.5mm}
  .card_contact-item{display:flex;gap:2mm}
  .card_contact-label{color:var(--color--muted);width:9mm}
  .card_bar{position:absolute;left:0;bottom:0;width:100%;height:1.6mm;background:var(--color--accent)}
</style>
</head>
<body>
<div class="page-wrapper">

  <!-- Recto -->
  <div class="card_component card_recto">
    <div class="card_shape"></div>
    <div class="card_logo">webina<span class="card_logo-dot">.</span></div>
    <div class="card_tagline">Sites web sur-mesure · Webflow</div>
  </div>

  <!-- Verso -->
  <div class="card_component card_verso">
    <div>
      <div class="card_name">Prénom Nom</div>
      <div class="card_role">Fondateur · Développeur Webflow</div>
    </div>
    <div class="card_contact-list">
      <div class="card_contact-item"><span class="card_contact-label">Mail</span><span>contact@webina.fr</span></div>
      <div class="card_contact-item"><span class="card_contact-label">Tél</span><span>+33 6 00 00 00 00</span></div>
      <div class="card_contact-item"><span class="card_contact-label">Web</span><span>webina.fr</span></div>
    </div>
    <div class="card_bar"></div>
  </div>

</div>
</body>
</html>
