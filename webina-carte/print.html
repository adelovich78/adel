<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Webina — Fichier impression</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  /* Format fini 85×55 mm, fond perdu 3 mm, zone de repères (slug) variable */
  :root{
    --trim-w:85mm; --trim-h:55mm; --bleed:3mm; --slug:SLUG;
    --color--black:#0a0a0a; --color--cream:#f8f4ee; --color--green:#7ed957;
    --color--green-soft:#eaf8e3; --color--grey:#6b6b6b;
  }
  @page{size:PAGEW PAGEH;margin:0}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:#fff;font-family:Poppins,sans-serif;-webkit-print-color-adjust:exact;print-color-adjust:exact}

  .print_page{position:relative;width:calc(var(--trim-w) + 2*var(--slug));height:calc(var(--trim-h) + 2*var(--slug));overflow:hidden;page-break-after:always}
  .print_page:last-child{page-break-after:auto}

  /* Zone imprimée = format fini + fond perdu */
  .print_bleed{position:absolute;left:calc(var(--slug) - var(--bleed));top:calc(var(--slug) - var(--bleed));
    width:calc(var(--trim-w) + 2*var(--bleed));height:calc(var(--trim-h) + 2*var(--bleed));overflow:hidden}

  /* Recto */
  .card_recto{background:var(--color--black);display:flex;align-items:center;justify-content:center}
  .card_recto-logo{height:36mm;width:auto}

  /* Verso : padding = 7 mm de marge intérieure + 3 mm de fond perdu */
  .card_verso{background:var(--color--cream);color:var(--color--black);display:flex;align-items:center;justify-content:space-between;gap:5mm;padding:0 10mm}
  .card_name{font-weight:700;font-size:5.4mm;line-height:1.1}
  .card_role{font-size:2.6mm;color:var(--color--grey);margin-top:.6mm;margin-bottom:3.6mm}
  .card_contact-list{display:flex;flex-direction:column;gap:1.8mm}
  .card_contact-item{display:flex;align-items:center;gap:2.2mm;font-size:2.7mm;font-weight:500}
  .card_icon{width:5mm;height:5mm;border-radius:1.4mm;background:var(--color--green-soft);display:flex;align-items:center;justify-content:center;flex:none}
  .card_icon svg{width:2.8mm;height:2.8mm;stroke:#3fa72a;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .card_qr{display:flex;flex-direction:column;align-items:center;gap:1.4mm;flex:none}
  .card_qr-image{width:19mm;height:19mm;display:block}
  .card_qr-label{font-size:2mm;font-weight:500;color:var(--color--grey)}
  /* La barre verte déborde dans le fond perdu */
  .card_bar{position:absolute;left:0;bottom:0;width:100%;height:calc(1.4mm + var(--bleed));background:var(--color--green)}

  /* Traits de coupe dans la zone de repères, hors fond perdu */
  .crop_mark{position:absolute;background:#000}
  .crop_mark.is-h{height:.1mm;width:calc(var(--slug) - var(--bleed) - 1mm)}
  .crop_mark.is-v{width:.1mm;height:calc(var(--slug) - var(--bleed) - 1mm)}
</style>
</head>
<body>

<!-- Page 1 : recto -->
<div class="print_page">
  <div class="print_bleed card_recto"><img class="card_recto-logo" src="logo-creme.png" alt="Webina"></div>
  MARKS
</div>

<!-- Page 2 : verso -->
<div class="print_page">
  <div class="print_bleed card_verso">
    <div class="card_verso-content">
      <div class="card_name">Webina</div>
      <div class="card_role">Digital Creation Agency</div>
      <div class="card_contact-list">
        <div class="card_contact-item"><span class="card_icon"><svg viewBox="0 0 24 24"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"/></svg></span>+90 531 080 02 77</div>
        <div class="card_contact-item"><span class="card_icon"><svg viewBox="0 0 24 24"><path d="M21 11.5a8.4 8.4 0 0 1-12.3 7.5L3 21l2-5.5A8.4 8.4 0 1 1 21 11.5z"/></svg></span>+90 539 966 25 57</div>
        <div class="card_contact-item"><span class="card_icon"><svg viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-10 6L2 7"/></svg></span>info@webina.com.tr</div>
      </div>
    </div>
    <div class="card_qr">
      <img class="card_qr-image" src="qr-webina.svg" alt="QR code www.webina.com.tr">
      <div class="card_qr-label">webina.com.tr</div>
    </div>
    <div class="card_bar"></div>
  </div>
  MARKS
</div>

</body>
</html>
